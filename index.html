<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page Title -->
    <title>Roshani Weds Suraj | Wedding Invitation</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="You are cordially invited to celebrate the wedding of Roshani & Suraj on 24 November 2026. Join us and be a part of our special day."
    />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Roshani Weds Suraj" />
    <meta
      property="og:title"
      content="Roshani Weds Suraj | Wedding Invitation"
    />
    <meta
      property="og:description"
      content="Join us as we celebrate the wedding of Roshani & Suraj on 24 November 2026. We would love to have you with us on our special day."
    />
    <meta property="og:url" content="https://roshani-weds-suraj.netlify.app/" />

    <!-- WhatsApp Preview Image -->
    <meta
      property="og:image"
      content="https://roshani-weds-suraj.netlify.app/images/wedding-preview.webp"
    />
    <meta
      property="og:image:secure_url"
      content="https://roshani-weds-suraj.netlify.app/images/wedding-preview.webp"
    />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="1733" />
    <meta property="og:image:height" content="908" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Roshani Weds Suraj | Wedding Invitation"
    />
    <meta
      name="twitter:description"
      content="Join us as we celebrate the wedding of Roshani & Suraj on 24 November 2026."
    />
    <meta
      name="twitter:image"
      content="https://roshani-weds-suraj.netlify.app/images/wedding-preview.webp"
    />

    <!-- Favicon -->
    <link rel="shortcut icon" type="image/png" href="images/favicon.ico" />

    <!-- CSS -->
    <link rel="stylesheet" type="text/css" href="css/all.css" />
    <link rel="stylesheet" type="text/css" href="css/aos.css" />
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="css/fontawesome.min.css" />
    <link rel="stylesheet" type="text/css" href="css/owl.carousel.min.css" />
    <link rel="stylesheet" type="text/css" href="css/style.css" />
  </head>

  <body>
    <!-- Background Music -->
    <audio id="bgMusic" loop>
      <source
        src="music/din_shagna_da.mp3"
        type="audio/mpeg"
      />
    </audio>

    <!-- Music Button -->
    <button id="musicBtn" aria-label="Play music">
      <i class="fa-solid fa-music"></i>
    </button>
    <section class="w-100">
      <div class="Wedding_card_main_wrapper">
        <div class="wedding_box1">
          <div class="wedding_detail_box">
            <div class="curved2">
              <svg viewBox="0 0 400 200">
                <!-- Define a half-circle path -->
                <defs>
                  <path id="halfCircle" d="M 50,150 A 150,150 0 0,1 350,150" />
                </defs>

                <!-- Attach text to the path -->
                <text>
                  <textPath
                    href="#halfCircle"
                    startOffset="50%"
                    text-anchor="middle"
                  >
                    Let's Celebrate
                  </textPath>
                </text>
              </svg>
              <span class="leave_vector_box">
                <img src="images/leave_vector_img.svg" alt="" />
              </span>
            </div>
            <h1
              class="main_title_txt"
              data-aos="zoom-in"
              data-aos-duration="2000"
              data-aos-delay="100"
            >
              Roshani & Suraj
            </h1>
            <div class="date_txt_box">
              <span class="icon_box">
                <svg
                  width="149"
                  height="12"
                  viewBox="0 0 149 12"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M0.226497 6L6 11.7735L11.7735 6L6 0.226497L0.226497 6ZM148 7C148.552 7 149 6.55228 149 6C149 5.44772 148.552 5 148 5V7ZM6 6V7L148 7V6V5L6 5V6Z"
                    fill="#C3AE94"
                  />
                </svg>
              </span>
              <h2>24. 11. 2026</h2>
              <span class="icon_box">
                <svg
                  width="149"
                  height="12"
                  viewBox="0 0 149 12"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M1 5C0.447715 5 0 5.44772 0 6C0 6.55228 0.447715 7 1 7L1 5ZM148.774 6L143 0.226497L137.226 6L143 11.7735L148.774 6ZM1 6L1 7L143 7V6V5L1 5L1 6Z"
                    fill="#C3AE94"
                  />
                </svg>
              </span>
            </div>
            <div id="countdown-container" class="countdown-container">
              <article id="js-countdown" class="countdown">
                <section id="js-days" class="number"></section>
                <section id="js-hours" class="number"></section>
                <section id="js-minutes" class="number"></section>
                <section id="js-seconds" class="number"></section>
              </article>
            </div>
            <div class="venue_txt_box">
              <h3>Asalpha Ghatkopar</h3>
            </div>
          </div>
        </div>
        <div class="wedding_box2">
          <div class="wedding_img_box with-bg-size"></div>
          <span class="vector_box1">
            <img src="images/leave_vector1.svg" alt="" />
          </span>
          <span class="vector_box2">
            <img src="images/leave_vector2.svg" alt="" />
          </span>
        </div>
        <span class="bg_vector_box">
          <img src="images/bg_leave_vector.svg" alt="" />
        </span>
      </div>
    </section>

    <!--  js link start-->
    <script type="text/javascript" src="js/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.min.js"></script>
    <script type="text/javascript" src="js/all.js"></script>
    <script type="text/javascript" src="js/aos.js"></script>
    <script type="text/javascript" src="js/fontawesome.min.js"></script>
    <script type="text/javascript" src="js/owl.carousel.min.js"></script>
    <script type="text/javascript" src="js/custom.js"></script>
  </body>
</html>
